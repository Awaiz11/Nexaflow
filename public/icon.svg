<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Dark Squircle Gradient -->
    <linearGradient id="nfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11101a"/>
      <stop offset="100%" stop-color="#06060a"/>
    </linearGradient>

    <!-- Glowing Cyan / Blue / Violet Border Gradient -->
    <linearGradient id="nfBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Electric Cyan to Royal Blue Gradient for N -->
    <linearGradient id="nfCyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Sleek Dark Squircle Base -->
  <rect x="2" y="2" width="44" height="44" rx="10.5" fill="url(#nfBg)"/>
  <rect x="2" y="2" width="44" height="44" rx="10.5" fill="none" stroke="url(#nfBorder)" stroke-width="1.8"/>

  <!-- High-Contrast Bold 'NF' Monogram -->
  <!-- 'N': Left Vertical Stem & Center Diagonal (Electric Cyan/Blue) -->
  <path d="M 11 35 L 11 13 L 24 35" 
        stroke="url(#nfCyanGrad)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- 'F': Center Vertical Stem (Pure Crisp White) -->
  <line x1="24" y1="13" x2="24" y2="35" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round"/>

  <!-- 'F': Top Horizontal Bar (Pure Crisp White) -->
  <line x1="24" y1="13" x2="37" y2="13" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round"/>

  <!-- 'F': Middle Speed Accent Bar (Vibrant Electric Cyan) -->
  <line x1="24" y1="23.5" x2="34.5" y2="23.5" stroke="#38bdf8" stroke-width="4.2" stroke-linecap="round"/>
</svg>